<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lendas do Combate</title><style>body{margin:0;background:#10091d;color:white;font-family:Arial;text-align:center}main{max-width:900px;margin:30px auto;padding:20px}h1{font-size:clamp(38px,8vw,72px);color:#e9aaff;text-shadow:0 0 18px #a020ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.fighter{border:1px solid #b92aff;border-radius:12px;padding:14px;background:#211331}.fighter img{width:100%;height:160px;object-fit:cover;background:#34204a}.locked{height:160px;display:grid;place-items:center;color:#aaa;background:#30233c}button{padding:12px 18px;background:#6012a0;color:white;border:1px solid #d64cff;border-radius:10px;font-size:16px}</style></head><body><main><h1>LENDAS DO COMBATE</h1><p>Escolha seu destino. Entre na arena!</p><h2>Seleção de lutadores</h2><div id="fighters" class="grid"></div><p>Primeira versão recuperada do projeto. Modo de luta e controles serão integrados nesta publicação.</p></main><script src="fighters.js"></script><script>const root=document.getElementById('fighters');FIGHTERS.forEach(f=>{const el=document.createElement('section');el.className='fighter';el.innerHTML=f.locked?'<div class="locked">EM BREVE</div><h3>EM BREVE</h3>':`<img src="${f.image}" alt="${f.name}"><h3>${f.name}</h3><p>${f.style}</p><p>Especial: ${f.special}</p>`;root.appendChild(el)})</script></body></html>
